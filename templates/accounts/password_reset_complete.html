{% extends 'base.html' %}

{% block title %}رمز عبور تغییر یافت | رزومینو{% endblock %}

{% block content %}
<section class="py-16 bg-gradient-to-b from-violet-50 to-white min-h-[calc(100vh-180px)] flex items-center">
  <div class="max-w-md w-full mx-auto px-4">
    <div class="bg-white/90 backdrop-blur-xl p-8 md:p-10 rounded-3xl shadow-xl border border-violet-100 text-center">

      <div class="w-16 h-16 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-6 shadow-sm border border-emerald-100">
        <i data-lucide="check-circle-2" class="w-8 h-8"></i>
      </div>

      <h1 class="text-2xl font-black text-slate-900 mb-3">رمز عبور با موفقیت تغییر کرد</h1>
      <p class="text-slate-600 text-sm leading-7 mb-8">
        رمز عبور شما با موفقیت بروزرسانی شد. اکنون می‌توانید با رمز عبور جدید وارد شوید.
      </p>

      <a href="{% url 'login' %}"
         class="inline-flex items-center justify-center gap-2 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-500/25">
        <i data-lucide="log-in" class="w-5 h-5"></i>
        <span>ورود به حساب کاربری</span>
      </a>

    </div>
  </div>
</section>
{% endblock %}
