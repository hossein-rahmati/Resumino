{% extends 'base.html' %}

{% block title %}
  ورود
{% endblock %}

{% block content %}
  <section class="py-16 bg-gradient-to-b from-violet-50 to-white">
  <div class="max-w-md mx-auto bg-white/80 backdrop-blur-sm p-8 rounded-2xl shadow-md border border-violet-100">

      <h1 class="text-2xl font-bold mb-6 text-center">ورود به حساب</h1>

      <form method="post" class="space-y-4">
        {% csrf_token %}

        {% for field in form %}
          <div>
            <label class="block mb-2 text-sm font-medium text-slate-700">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
              <div class="text-red-500 text-sm mt-1">{{ field.errors.0 }}</div>
            {% endif %}
          </div>
        {% endfor %}

        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl hover:bg-blue-700 transition">ورود</button>
      </form>

      <p class="text-sm text-center text-slate-600 mt-6">
        حساب نداری؟
        <a href="{% url 'register' %}" class="text-blue-600 hover:underline">ثبت‌نام کن</a>
      </p>
    </div>
  </section>
{% endblock %}
