{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        رزومینو
      {% endblock %}
    </title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Vazirmatn', 'sans-serif']
            }
          }
        }
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-800 font-sans">
    <!-- Navbar -->
    <header class="bg-white border-b">
      <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
        <a href="{% url 'home' %}" class="text-xl font-bold text-blue-600">رزومه‌ساز</a>

        <div class="space-x-4 space-x-reverse flex items-center">
          <a href="{% url 'home' %}" class="text-slate-600 hover:text-blue-600">خانه</a>

          {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}" class="text-slate-600 hover:text-blue-600">داشبورد</a>

            <form method="post" action="{% url 'logout' %}" class="inline">
              {% csrf_token %}
              <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">خروج</button>
            </form>
          {% else %}
            <a href="{% url 'login' %}" class="text-slate-600 hover:text-blue-600">ورود</a>
            <a href="{% url 'register' %}" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">ثبت‌نام</a>
          {% endif %}
        </div>
      </div>
    </header>

    <main>
      {% block content %}
      {% endblock %}
    </main>
  </body>
</html>
