{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% block title %}رزومینو{% endblock %}</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/dist/font-face.css" rel="stylesheet"/>

    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

<header id="mainHeader"
        class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-sm border-b border-slate-100 transition-all duration-300">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">

        <div class="space-x-8 space-x-reverse flex items-center">
            <a href="{% url 'core:home' %}" class="text-xl font-bold text-blue-600">رزومینو</a>
            <a href="{% url 'core:home' %}" class="text-slate-600 hover:text-blue-600">خانه</a>
            <a href="{% url 'core:about' %}" class="text-slate-600 hover:text-blue-600">درباره ما</a>
            <a href="{% url 'core:contact' %}" class="text-slate-600 hover:text-blue-600">تماس با ما</a>
        </div>
        <div>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="text-blue-600 font-bold">داشبورد</a>

                <form method="post" action="{% url 'logout' %}" class="inline">
                    {% csrf_token %}
                    <button type="submit"
                            class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition text-sm">خروج
                    </button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="text-slate-600 px-4 py-2 hover:text-blue-600">ورود</a>
                <a href="{% url 'register' %}"
                   class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">ثبت‌نام</a>
            {% endif %}
        </div>
    </div>
</header>

<main class="pt-24">
    {% block content %}
    {% endblock %}
</main>

<footer class="bg-gradient-to-b from-slate-100 to-slate-200 text-slate-700 py-12 border-t border-slate-200 mt-10">
    <div class="max-w-6xl mx-auto px-4 text-center">
        <p class="mb-4">© تمامی حقوق محفوظ است</p>
        <div class="space-x-4 space-x-reverse">
            <a href="{% url 'home' %}" class="hover:text-blue-600">خانه</a>
            <a href="{% url 'about' %}" class="hover:text-blue-600">درباره ما</a>
            <a href="{% url 'contact' %}" class="hover:text-blue-600">تماس با ما</a>
        </div>
    </div>
</footer>

</body>
</html>
