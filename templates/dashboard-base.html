{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<title>{% block title %}داشبورد{% endblock %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Font -->
<link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/Vazirmatn-font-face.css" rel="stylesheet" />

<!-- Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
body {
font-family: Vazirmatn, sans-serif;
}
</style>
</head>

<body class="bg-slate-50 text-slate-800">

<div class="flex min-h-screen">

<!-- Sidebar -->
<aside class="w-72 bg-white border-l border-slate-200 hidden md:flex flex-col shadow-sm">

<!-- Logo -->
<div class="p-6 border-b border-slate-100">
<a href="/" class="flex items-center gap-3">
<div class="w-11 h-11 rounded-2xl bg-blue-600 flex items-center justify-center text-white">
<i data-lucide="sparkles" class="w-5 h-5"></i>
</div>
<div>
<h1 class="text-xl font-black text-blue-700">رزومینو</h1>
<p class="text-xs text-slate-400">پنل مدیریت رزومه</p>
</div>
</a>
</div>

<!-- Navigation -->
<nav class="flex-1 px-4 py-6 space-y-2">

<a href="{% url 'dashboard' %}"
class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-50 text-blue-700 font-bold">
<i data-lucide="layout-dashboard" class="w-5 h-5"></i>
داشبورد
</a>

<a href="#"
class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-100">
<i data-lucide="file-text" class="w-5 h-5"></i>
رزومه‌های من
</a>

<a href="#"
class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-100">
<i data-lucide="palette" class="w-5 h-5"></i>
قالب‌های رزومه
</a>

<a href="#"
class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-100">
<i data-lucide="briefcase" class="w-5 h-5"></i>
فرصت‌های شغلی
</a>

<a href="#"
class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-100">
<i data-lucide="send" class="w-5 h-5"></i>
ارسال‌های من
</a>



</nav>

<!--
<div class="p-4 border-t border-slate-100">
<form method="post" action="{% url 'logout' %}">
{% csrf_token %}
<button type="submit"
class="w-full flex items-center justify-center gap-2 px-4 py-3 text-red-600 hover:bg-red-50 rounded-xl font-bold">
<i data-lucide="log-out" class="w-5 h-5"></i>
خروج از حساب
</button>
</form>
</div>
  -->
</aside>

<!-- Main Content -->
<main class="flex-1 p-6 md:p-10">

<!-- ======== Top Bar با منوی کاربری جدید ======== -->
<div class="flex items-center justify-between mb-8">

    <h1 class="text-2xl font-black text-slate-900">
        {% block page_title %}داشبورد{% endblock %}
    </h1>

    <div class="flex items-center gap-4">

        <!-- دکمه زنگ -->
        <button class="relative p-2 rounded-xl hover:bg-slate-100">
            <i data-lucide="bell" class="w-6 h-6"></i>
        </button>

        <!-- منوی کاربری (آواتار + کشویی) -->
        <div class="relative" id="user-menu-container">
            <button id="user-menu-button" class="flex items-center gap-2 p-1 rounded-xl hover:bg-slate-100 transition">
                <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </div>
                <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
            </button>

            <!-- منوی کشویی -->
            <div id="user-dropdown" class="absolute left-0 mt-2 w-56 bg-white rounded-xl shadow-lg border border-slate-100 hidden py-2 z-50">
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">
                    <i data-lucide="user" class="w-4 h-4"></i>
                    داشبورد
                </a>
                <a href="{% url 'account_settings' %}" class="flex items-center gap-3 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                   تنظیمات حساب کاربری
                </a>
                <hr class="my-1 border-slate-100">
                <form method="post" action="{% url 'logout' %}" class="block">
                    {% csrf_token %}
                    <button type="submit" class="flex items-center gap-3 px-4 py-2 text-sm text-red-600 hover:bg-red-50 w-full text-right">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                        خروج
                    </button>
                </form>
            </div>
        </div>

    </div>

</div>
<!-- ======== پایان Top Bar ======== -->

{% block content %}
{% endblock %}

</main>

</div>

<script>
lucide.createIcons();

// ====== مدیریت باز/بسته شدن منوی کاربری ======
document.addEventListener('DOMContentLoaded', function() {
    const button = document.getElementById('user-menu-button');
    const dropdown = document.getElementById('user-dropdown');

    if (button && dropdown) {
        button.addEventListener('click', function(e) {
            e.stopPropagation();
            dropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', function(e) {
            if (!dropdown.classList.contains('hidden') &&
                !button.contains(e.target) &&
                !dropdown.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });
    }
});
</script>

</body>
</html>
